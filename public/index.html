<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projector sim</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        font:
          13px system-ui,
          sans-serif;
      }
      #panel {
        flex: none;
        width: 300px;
        box-sizing: border-box;
        padding: 8px;
        overflow-y: auto;
      }
      #stage {
        flex: 1;
        min-width: 0;
        position: relative;
      }
      #view {
        position: absolute;
        width: 100%;
        height: 100%;
      }
      h2 {
        margin: 12px 0 4px;
        font-size: 13px;
      }
      select,
      #objects button {
        display: block;
        width: 100%;
        margin-bottom: 2px;
        text-align: left;
      }
      button.on {
        font-weight: bold;
        background: #cde;
      }
      label {
        display: block;
        margin-bottom: 4px;
      }
      input[type="number"],
      input[type="range"] {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      #stats {
        white-space: pre;
        font:
          11px ui-monospace,
          monospace;
      }
      #error {
        color: #c00;
        font-weight: bold;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"
        }
      }
    </script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="panel">
      <div id="error"></div>

      <h2>Scene (shared live, saved automatically)</h2>
      <select id="scenes"></select>
      <button id="newScene">New</button>
      <button id="copyScene">Duplicate</button>
      <button id="renameScene">Rename</button>
      <button id="deleteScene">Delete</button>

      <h2>Objects</h2>
      <div id="objects"></div>
      <button id="addFlat">+ Flat mirror</button>
      <button id="addSpherical">+ Spherical mirror</button>
      <button id="deleteMirror">Delete mirror</button>

      <h2>Drag handles / camera</h2>
      <button id="move">Move</button>
      <button id="rotate">Rotate</button>
      <button id="view3d">3D view</button>
      <button id="viewTop">Top view</button>

      <h2>Projected picture</h2>
      <select id="picture">
        <option value="pattern">Test pattern</option>
        <option value="list-dark">Recipe list, dark</option>
        <option value="list-light">Recipe list, light</option>
        <option value="recipe-dark">Recipe view, dark</option>
        <option value="recipe-light">Recipe view, light</option>
      </select>

      <h2>Result</h2>
      <div id="stats"></div>

      <h2>Selected object</h2>
      <div id="fields"></div>
    </div>
    <div id="stage"><canvas id="view"></canvas></div>
  </body>
</html>
